# The vector extras: what OpenStreetMap Carto draws and the Protomaps basemap
# on tiles.openhikes.app leaves out, as a second PMTiles archive the app
# draws into the same tiles (`VectorTileSource.extras`).
#
# Its layers and attributes are named as the basemap's are — `landuse`,
# `roads` and `pois` with `kind`, `kind_detail` and `name:<language>` — so a
# tile of each merges into one and is read by the same code. `parks`,
# `protected_areas`, `area_details`, `barriers`, `oneways`, `paths`,
# `service_roads`, `construction`, `power`, `power_points`, `dams`,
# `breakwaters`, `ridges`, `cliffs`, `cutlines`, `trees`, `intermittent` and
# `building_names` are the layers of its own, and a car park's `access` and
# an area's `area` the attributes. Most features wait for zoom 14 or 15: the
# map draws deeper zooms from zoom 15, and Carto draws none of these wider.
# The names of areas come in from the zoom Carto could first name each, by
# its size, and the ground, the lifts, the huts and the stations from the
# zoom Carto first draws each.
#
# Scripts/lib/vector-extras.filter cuts the planet down to these tags first;
# change both together. Built by Scripts/vector-extras.sh.
schema_name: OpenHikes extras
schema_description: OpenStreetMap features the Protomaps basemap leaves out, for the OpenHikes map.
attribution: <a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap contributors</a>
args:
  osm_path:
    description: The planet cut down by Scripts/lib/vector-extras.filter
    default: extras.osm.pbf
sources:
  osm:
    type: osm
    local_path: '${ args.osm_path }'
definitions:
  attributes:
  - &name
    key: name
  - &name_en
    key: 'name:en'
    tag_value: 'name:en'
  - &name_de
    key: 'name:de'
    tag_value: 'name:de'
  - &name_fr
    key: 'name:fr'
    tag_value: 'name:fr'
  - &name_es
    key: 'name:es'
    tag_value: 'name:es'
  - &name_it
    key: 'name:it'
    tag_value: 'name:it'
  - &name_ru
    key: 'name:ru'
    tag_value: 'name:ru'
  - &name_pl
    key: 'name:pl'
    tag_value: 'name:pl'
  - &name_uk
    key: 'name:uk'
    tag_value: 'name:uk'
  # An area's size, in the square pixels of the whole world drawn as one
  # 256-pixel tile: times 4 to the power of a zoom, its size at that zoom,
  # which Carto calls `way_pixels`. Web Mercator's, as Carto's is. Measured
  # in z0 tiles: Planetiler 0.10.2 divides by 256 for a z0 pixel where it
  # should multiply, so its square z0 pixel comes out 2^32 times too small.
  - &area
    key: area
    value: '${ feature.area("z0 tile2") * 65536.0 }'
    type: double
  # A way's surface as Carto reads it (`carto_highway_int_surface`): paved,
  # unpaved, or neither for a value it does not know.
  - &paved
    key: surface
    value: paved
    include_when:
      surface: [paved, asphalt, cobblestone, 'cobblestone:flattened', sett, concrete, 'concrete:lanes', 'concrete:plates', paving_stones, metal, wood, unhewn_cobblestone]
  - &unpaved
    key: surface
    value: unpaved
    include_when:
      surface: [unpaved, compacted, dirt, earth, fine_gravel, grass, grass_paver, gravel, ground, mud, pebblestone, salt, sand, woodchips, clay, ice, snow]
  # Carto's own bridges and tunnels, a covered way among the tunnels.
  - &is_bridge
    key: is_bridge
    value: true
    include_when:
      bridge: ['yes', boardwalk, cantilever, covered, low_water_crossing, movable, trestle, viaduct]
  - &is_tunnel
    key: is_tunnel
    value: true
    include_when:
      __any__:
      - tunnel: ['yes', building_passage, avalanche_protector]
      - covered: 'yes'
layers:
# Car parks, which the basemap has no fill for at all.
- id: landuse
  features:
  - source: osm
    geometry: polygon
    min_zoom: 14
    include_when:
      amenity: parking
    exclude_when:
      parking: underground
    attributes:
    - key: kind
      value: parking

  # Ground the basemap has no kind for, which Carto fills: the scree, heath
  # and shingle of open mountains from zoom 8, where Carto's low-zoom picture
  # has them, and the rest from zoom 10, where its landcover begins. `kind`
  # is the tag's value, as the basemap's landuse is named. The basemap files
  # an orchard and a farmyard as farmland and a brownfield as industry; the
  # same area from here is drawn over it. A building is never ground.
  - source: osm
    geometry: polygon
    min_zoom: 8
    include_when:
      natural: [scree, heath, shingle, mud]
    exclude_when: &is_building
      __all__:
      - building: __any__
      - __not__:
          building: 'no'
    attributes: &kind_of_ground
    - key: kind
      type: match_value
  - source: osm
    geometry: polygon
    min_zoom: 10
    include_when:
      landuse: [retail, quarry, vineyard, orchard, plant_nursery, farmyard, construction, brownfield, landfill, garages, greenhouse_horticulture, religious]
    exclude_when: *is_building
    attributes: *kind_of_ground
  - source: osm
    geometry: polygon
    min_zoom: 10
    include_when:
      tourism: [camp_site, caravan_site, picnic_site]
    exclude_when: *is_building
    attributes: *kind_of_ground
  # A grave yard's religion is its `kind_detail`: Carto fills one with the
  # symbols of its religion.
  - source: osm
    geometry: polygon
    min_zoom: 10
    include_when:
      amenity: grave_yard
    exclude_when: *is_building
    attributes:
    - key: kind
      type: match_value
    - key: kind_detail
      tag_value: religion
      include_when:
        religion: [christian, jewish, muslim]
  - source: osm
    geometry: polygon
    min_zoom: 10
    include_when:
      leisure: [stadium, sports_centre, track, ice_rink, miniature_golf, fitness_station, fitness_centre, water_park]
    exclude_when: *is_building
    attributes: *kind_of_ground
  - source: osm
    geometry: polygon
    min_zoom: 10
    include_when:
      power: [plant, generator, substation]
    exclude_when: *is_building
    attributes:
    - key: kind
      value: power
  - source: osm
    geometry: polygon
    min_zoom: 10
    include_when:
      man_made: [works, wastewater_plant, water_works]
    exclude_when: *is_building
    attributes: *kind_of_ground
  - source: osm
    geometry: polygon
    min_zoom: 10
    include_when:
      aeroway: apron
    attributes: *kind_of_ground
  - source: osm
    geometry: polygon
    min_zoom: 10
    include_when:
      highway: [services, rest_area]
    exclude_when: *is_building
    attributes:
    - key: kind
      value: rest_area

  # A square or a pedestrian street mapped as a relation, which the basemap
  # passes over: it keeps the ones mapped as a way tagged `area=yes`. Filed
  # under the basemap's own kind for those, from zoom 14, where Carto fills
  # one.
  - source: osm
    geometry: polygon
    min_zoom: 14
    include_when:
      __all__:
      - highway: [pedestrian, footway]
      - type: multipolygon
    exclude_when:
      area: 'yes'
    attributes:
    - key: kind
      value: pedestrian

  # A bridge mapped as an area, which the basemap files as a pedestrian
  # square: drawn over that in Carto's gray, from zoom 12.
  - source: osm
    geometry: polygon
    min_zoom: 12
    include_when:
      man_made: bridge
    attributes:
    - key: kind
      value: bridge

  # A shoal and a salt pond, which the basemap has no kind for, and a danger
  # area, which Carto hatches in red over whatever lies in it, from zoom 9.
  # A shoal's surface is its `kind_detail`, which Carto picks its symbols by.
  - source: osm
    geometry: polygon
    min_zoom: 10
    include_when:
      natural: shoal
    attributes:
    - key: kind
      type: match_value
    - key: kind_detail
      tag_value: surface
      include_when:
        surface: [sand, gravel, fine_gravel, pebbles, pebblestone, shingle, stones, shells]
  - source: osm
    geometry: polygon
    min_zoom: 10
    include_when:
      landuse: salt_pond
    attributes: *kind_of_ground
  - source: osm
    geometry: polygon
    min_zoom: 9
    include_when:
      military: danger_area
    attributes: *kind_of_ground

# Parks. The basemap files a park and most national parks under one kind, so
# a national park's rock and ice would be filled as a city park is: the map
# fills these and none of the basemap's. From zoom 10, where Carto first
# fills one.
- id: parks
  features:
  - source: osm
    geometry: polygon
    min_zoom: 10
    include_when:
      leisure: park
    exclude_when: *is_building
    attributes:
    - key: kind
      value: park

# The borders of national parks, nature reserves and the protected areas of
# the classes Carto draws, as the areas they enclose: the map strokes each
# one's edge. The basemap has a kind for a few national parks and no
# protected area. From zoom 8 and only once an area covers 750 square pixels,
# as in Carto, until zoom 15, which every deeper zoom is drawn from. The
# wider buffer keeps the cut edge of an area that runs past a tile outside
# the band drawn along its border.
- id: protected_areas
  buffer: 8
  features:
  - source: osm
    geometry: polygon
    min_zoom: 8
    min_size: 27
    include_when:
      boundary: aboriginal_lands
    attributes:
    - key: kind
      value: aboriginal_lands
  - source: osm
    geometry: polygon
    min_zoom: 8
    min_size: 27
    include_when:
      __any__:
      - boundary: national_park
      - leisure: nature_reserve
      - __all__:
        - boundary: protected_area
        - protect_class: ['1', '1a', '1b', '2', '3', '4', '5', '6']
    exclude_when:
      boundary: aboriginal_lands
    attributes:
    - key: kind
      value: protected_area

# What the basemap drops of an area Carto fills with symbols by it: a wood's
# leaves, a wetland's kind, a beach's surface, a cemetery's religion. The
# basemap has the area itself, and gives it the id OpenStreetMap does, so
# each of these is that id (`VectorTileAreaDetails`) with the tag's value as
# its `kind_detail`, and only where the value is one Carto has a symbol for.
# The map draws the basemap's area, so the area here is only what brings its
# id to the tiles the basemap's is on, kept as rough as will still do that.
# A wetland comes in at zoom 10, where Carto first fills one by its kind,
# and the rest at 13, where the symbols begin.
- id: area_details
  features:
  - source: osm
    geometry: polygon
    id: &basemap_id '${ (feature.osm_type == "relation" ? 52776558133248 : 35184372088832) + feature.id }'
    min_zoom: 13
    min_size: 2
    tolerance: 2
    tolerance_at_max_zoom: 2
    include_when:
      __all__:
      - __any__:
        - natural: wood
        - landuse: forest
      - leaf_type: [broadleaved, needleleaved, mixed, leafless]
    attributes:
    - key: kind_detail
      tag_value: leaf_type
  - source: osm
    geometry: polygon
    id: *basemap_id
    min_zoom: 10
    min_size: 2
    tolerance: 2
    tolerance_at_max_zoom: 2
    include_when:
      __all__:
      - natural: wetland
      - wetland: [marsh, saltmarsh, wet_meadow, reedbed, mangrove, swamp, bog, fen, string_bog, tidalflat]
    attributes:
    - key: kind_detail
      tag_value: wetland
  - source: osm
    geometry: polygon
    id: *basemap_id
    min_zoom: 13
    min_size: 2
    tolerance: 2
    tolerance_at_max_zoom: 2
    include_when:
      __all__:
      - natural: beach
      - surface: [sand, gravel, fine_gravel, pebbles, pebblestone, shingle, stones, shells]
    attributes:
    - key: kind_detail
      tag_value: surface
  - source: osm
    geometry: polygon
    id: *basemap_id
    min_zoom: 13
    min_size: 2
    tolerance: 2
    tolerance_at_max_zoom: 2
    include_when:
      __all__:
      - landuse: cemetery
      - religion: [christian, jewish, muslim]
    attributes:
    - key: kind_detail
      tag_value: religion

# Aerial lifts, of which the basemap keeps the cable cars alone: gondolas,
# chair lifts, drag lifts and the rest, from zoom 12, where Carto draws them
# all. Named as the basemap's own cable cars are, so they are drawn and named
# with them. And the railways the basemap keeps only from zoom 14, at the
# zooms before it: narrow-gauge and light railways and funiculars from 10,
# trams and subways from 12.
- id: roads
  features:
  - source: osm
    geometry: line
    min_zoom: 10
    max_zoom: 13
    include_when:
      railway: [narrow_gauge, light_rail, funicular]
    attributes: &light_railway
    - key: kind
      value: rail
    - key: kind_detail
      tag_value: railway
    - key: is_tunnel
      value: true
      include_when:
        tunnel: ['yes', building_passage, covered]
  - source: osm
    geometry: line
    min_zoom: 12
    max_zoom: 13
    include_when:
      railway: [tram, subway]
    attributes: *light_railway
  - source: osm
    geometry: line
    min_zoom: 12
    include_when:
      aerialway: [gondola, mixed_lift, goods, chair_lift, drag_lift, t-bar, j-bar, platter, rope_tow, zip_line]
    attributes:
    - key: kind
      value: aerialway
    - key: kind_detail
      tag_value: aerialway
    - *name
    - *name_en
    - *name_de
    - *name_fr
    - *name_es
    - *name_it
    - *name_ru
    - *name_pl
    - *name_uk

# Each point keeps the id Planetiler gives it, the OpenStreetMap element's
# times ten plus 1 for a node, 2 for a way and 3 for a relation, by which the
# map drops the basemap's point for the same element where a point here
# stands in its place, named or not (`VectorTilePoints.Superseded`). So no
# feature here sets an `id`.
- id: pois
  features:
  # A car park mapped as an area, at a point inside it, named or not: the
  # basemap keeps an area's point only when it is named, and never its size,
  # which Carto marks a car park by from zoom 14. Its access is kept because
  # Carto fades a car park that is private or for customers, and its `parking`
  # as its `kind_detail` because Carto marks parking along a street, or in a
  # lane of it, only from zoom 18, and with a quieter icon, whatever its size.
  - source: osm
    geometry: polygon_point_on_surface
    min_zoom:
    - if: '${ feature.area("z0 tile2") * 65536.0 * 268435456.0 > 750.0 }'
      value: 14
    - else: 15
    include_when:
      amenity: parking
    exclude_when:
      parking: underground
    attributes:
    - key: kind
      value: parking
    - key: kind_detail
      tag_value: parking
    - key: access
      tag_value: access
    - *area
    - *name
    - *name_en
    - *name_de
    - *name_fr
    - *name_es
    - *name_it
    - *name_ru
    - *name_pl
    - *name_uk

  # The names of areas — forests, parks, nature reserves, national parks,
  # islands, meadows, schools — at a point inside each, with its size, which
  # Carto names an area by: from a wider zoom and in a larger size the larger
  # it is (`VectorTilePointStyle`). The basemap keeps a named area's point
  # without its size, from a zoom of its own choosing.
  #
  # Carto files an area under the first of its tags its query tries, so each
  # of the features below leaves out an area an earlier key of Carto's claims:
  # a playground on grass is a playground, not grass. The kinds are those
  # `Scripts/carto-points.sh` finds drawn by their size, less a shop or an
  # office (`drawnBySize`), a car park (above) and a place of worship, which
  # is mostly a building. A building is named by its own layer in Carto, not
  # as land, so none is kept here.
  #
  # Carto's points begin at zoom 10, and so do these. Below it Carto names
  # areas from a query of its own, which tries fewer keys in another order,
  # and the features after these file an area by that one through zoom 9.
  #
  # An area comes in at the first zoom it covers 3,000 square pixels, the
  # least Carto names an area at, and at zoom 15 at the latest, which every
  # deeper zoom is drawn from.
  - source: osm
    geometry: polygon_point_on_surface
    min_zoom: &named_area_zoom
    - if: '${ feature.area("z0 tile2") * 65536.0 * 1048576.0 > 3000.0 }'
      value: 10
    - if: '${ feature.area("z0 tile2") * 65536.0 * 4194304.0 > 3000.0 }'
      value: 11
    - if: '${ feature.area("z0 tile2") * 65536.0 * 16777216.0 > 3000.0 }'
      value: 12
    - if: '${ feature.area("z0 tile2") * 65536.0 * 67108864.0 > 3000.0 }'
      value: 13
    - if: '${ feature.area("z0 tile2") * 65536.0 * 268435456.0 > 3000.0 }'
      value: 14
    - else: 15
    include_when:
      aeroway: [aerodrome, apron]
    exclude_when: &unnamed_or_building
      __any__:
      - name: ''
      - __all__:
        - building: __any__
        - __not__:
            building: 'no'
    attributes: &named_area
    - key: kind
      type: match_value
    - *area
    - *name
    - *name_en
    - *name_de
    - *name_fr
    - *name_es
    - *name_it
    - *name_ru
    - *name_pl
    - *name_uk
  - source: osm
    geometry: polygon_point_on_surface
    min_zoom: *named_area_zoom
    include_when:
      tourism: [theme_park, zoo]
    exclude_when:
      __any__:
      - *unnamed_or_building
      - aeroway: &carto_aeroway [gate, apron, helipad, aerodrome]
    attributes: *named_area
  - source: osm
    geometry: polygon_point_on_surface
    min_zoom: *named_area_zoom
    include_when:
      amenity: [college, grave_yard, kindergarten, marketplace, school, university]
    exclude_when:
      __any__:
      - *unnamed_or_building
      - aeroway: *carto_aeroway
      - tourism: &carto_tourism [alpine_hut, apartment, artwork, camp_site, caravan_site, chalet, gallery, guest_house, hostel, hotel, motel, museum, picnic_site, theme_park, wilderness_hut, zoo]
    attributes: *named_area
  - source: osm
    geometry: polygon_point_on_surface
    min_zoom: *named_area_zoom
    include_when:
      shop: mall
    exclude_when:
      __any__:
      - *unnamed_or_building
      - aeroway: *carto_aeroway
      - tourism: *carto_tourism
      - amenity: &carto_amenity [arts_centre, atm, bank, bar, bbq, bicycle_rental, bicycle_repair_station, biergarten, boat_rental, bureau_de_change, bus_station, cafe, car_rental, car_wash, casino, charging_station, childcare, cinema, clinic, college, community_centre, courthouse, dentist, doctors, drinking_water, driving_school, fast_food, ferry_terminal, fire_station, food_court, fountain, fuel, grave_yard, hospital, hunting_stand, ice_cream, internet_cafe, kindergarten, library, marketplace, nightclub, nursing_home, pharmacy, place_of_worship, police, post_box, post_office, prison, pub, public_bath, public_bookcase, recycling, restaurant, school, shelter, shower, social_facility, taxi, telephone, theatre, toilets, townhall, university, vehicle_inspection, veterinary, waste_disposal, parcel_locker]
      - location: underground
    attributes: *named_area
  # A pitch's or a sports centre's sport, which Carto names a swimming
  # centre's by, is its `kind_detail`.
  - source: osm
    geometry: polygon_point_on_surface
    min_zoom: *named_area_zoom
    include_when:
      leisure: [garden, ice_rink, marina, park, pitch, sports_centre, stadium, swimming_pool, track]
    exclude_when:
      __any__:
      - *unnamed_or_building
      - aeroway: *carto_aeroway
      - tourism: *carto_tourism
      - amenity: *carto_amenity
      - shop: __any__
    attributes:
    - key: kind
      type: match_value
    - key: kind_detail
      tag_value: sport
    - *area
    - *name
    - *name_en
    - *name_de
    - *name_fr
    - *name_es
    - *name_it
    - *name_ru
    - *name_pl
    - *name_uk
  - source: osm
    geometry: polygon_point_on_surface
    min_zoom: *named_area_zoom
    include_when:
      power: [generator, plant, substation]
    exclude_when:
      __any__:
      - *unnamed_or_building
      - aeroway: *carto_aeroway
      - tourism: *carto_tourism
      - amenity: *carto_amenity
      - shop: __any__
      - leisure: &carto_leisure [amusement_arcade, beach_resort, bird_hide, bowling_alley, dance, dog_park, firepit, fishing, fitness_centre, fitness_station, garden, golf_course, ice_rink, marina, miniature_golf, outdoor_seating, park, picnic_table, pitch, playground, sauna, slipway, sports_centre, stadium, swimming_area, swimming_pool, track, water_park]
    attributes: *named_area
  - source: osm
    geometry: polygon_point_on_surface
    min_zoom: *named_area_zoom
    include_when:
      man_made: [wastewater_plant, water_works, works]
    exclude_when:
      __any__:
      - *unnamed_or_building
      - aeroway: *carto_aeroway
      - tourism: *carto_tourism
      - amenity: *carto_amenity
      - shop: __any__
      - leisure: *carto_leisure
      - power: &carto_power [plant, generator, substation]
    attributes: *named_area
  - source: osm
    geometry: polygon_point_on_surface
    min_zoom: *named_area_zoom
    include_when:
      landuse: [allotments, brownfield, cemetery, commercial, construction, farmland, farmyard, forest, garages, grass, greenhouse_horticulture, industrial, landfill, meadow, military, orchard, plant_nursery, quarry, railway, recreation_ground, residential, retail, salt_pond, village_green, vineyard]
    exclude_when:
      __any__:
      - *unnamed_or_building
      - aeroway: *carto_aeroway
      - tourism: *carto_tourism
      - amenity: *carto_amenity
      - shop: __any__
      - leisure: *carto_leisure
      - power: *carto_power
      - man_made: &carto_man_made [ceremonial_gate, chimney, communications_tower, crane, lighthouse, mast, obelisk, silo, storage_tank, telescope, tower, wastewater_plant, water_tower, water_works, windmill, works]
    attributes: *named_area
  - source: osm
    geometry: polygon_point_on_surface
    min_zoom: *named_area_zoom
    include_when:
      natural: [bare_rock, beach, grassland, heath, mud, reef, sand, scree, scrub, shingle, wetland, wood]
    exclude_when:
      __any__:
      - *unnamed_or_building
      - aeroway: *carto_aeroway
      - tourism: *carto_tourism
      - amenity: *carto_amenity
      - shop: __any__
      - leisure: *carto_leisure
      - power: *carto_power
      - man_made: *carto_man_made
      - landuse: &carto_landuse [reservoir, basin, recreation_ground, village_green, quarry, vineyard, orchard, cemetery, residential, garages, meadow, grass, allotments, forest, farmyard, farmland, greenhouse_horticulture, retail, industrial, railway, commercial, brownfield, landfill, construction, salt_pond, military, plant_nursery]
    attributes: *named_area
  - source: osm
    geometry: polygon_point_on_surface
    min_zoom: *named_area_zoom
    include_when:
      place: [island, islet]
    exclude_when:
      __any__:
      - *unnamed_or_building
      - aeroway: *carto_aeroway
      - tourism: *carto_tourism
      - amenity: *carto_amenity
      - shop: __any__
      - leisure: *carto_leisure
      - power: *carto_power
      - man_made: *carto_man_made
      - landuse: *carto_landuse
      - natural: &carto_natural [wood, water, mud, wetland, bay, spring, scree, shingle, bare_rock, sand, heath, grassland, scrub, beach, glacier, tree, strait, cape, reef, peninsula]
    attributes: *named_area
  - source: osm
    geometry: polygon_point_on_surface
    min_zoom: *named_area_zoom
    include_when:
      military: danger_area
    exclude_when:
      __any__:
      - *unnamed_or_building
      - aeroway: *carto_aeroway
      - tourism: *carto_tourism
      - amenity: *carto_amenity
      - shop: __any__
      - leisure: *carto_leisure
      - power: *carto_power
      - man_made: *carto_man_made
      - landuse: *carto_landuse
      - natural: *carto_natural
      - place: &carto_place [island, islet, square]
      - historic: &carto_historic [memorial, monument, archaeological_site, fort, castle, manor, city_gate]
    attributes: *named_area
  - source: osm
    geometry: polygon_point_on_surface
    min_zoom: *named_area_zoom
    include_when:
      highway: [rest_area, services]
    exclude_when:
      __any__:
      - *unnamed_or_building
      - aeroway: *carto_aeroway
      - tourism: *carto_tourism
      - amenity: *carto_amenity
      - shop: __any__
      - leisure: *carto_leisure
      - power: *carto_power
      - man_made: *carto_man_made
      - landuse: *carto_landuse
      - natural: *carto_natural
      - place: *carto_place
      - historic: *carto_historic
      - military: &carto_military [danger_area, bunker]
    attributes: *named_area
  # Carto names a protected area only of the classes it draws, which is its
  # `kind_detail`.
  - source: osm
    geometry: polygon_point_on_surface
    min_zoom: *named_area_zoom
    include_when:
      __any__:
      - boundary: [aboriginal_lands, national_park]
      - __all__:
        - boundary: protected_area
        - protect_class: &carto_protect_class ['1', '1a', '1b', '2', '3', '4', '5', '6']
    exclude_when: &before_boundary
      __any__:
      - *unnamed_or_building
      - aeroway: *carto_aeroway
      - tourism: *carto_tourism
      - amenity: *carto_amenity
      - shop: __any__
      - leisure: *carto_leisure
      - power: *carto_power
      - man_made: *carto_man_made
      - landuse: *carto_landuse
      - natural: *carto_natural
      - place: *carto_place
      - historic: *carto_historic
      - military: *carto_military
      - highway: [services, rest_area, bus_stop, elevator, traffic_signals]
    attributes: &protected_area
    - key: kind
      tag_value: boundary
    - key: kind_detail
      tag_value: protect_class
      include_when:
        boundary: protected_area
    - *area
    - *name
    - *name_en
    - *name_de
    - *name_fr
    - *name_es
    - *name_it
    - *name_ru
    - *name_pl
    - *name_uk
  - source: osm
    geometry: polygon_point_on_surface
    min_zoom: *named_area_zoom
    include_when:
      leisure: nature_reserve
    exclude_when:
      __any__:
      - *before_boundary
      - boundary: [aboriginal_lands, national_park]
      - __all__:
        - boundary: protected_area
        - protect_class: *carto_protect_class
    attributes: *named_area

  # The same areas' names below zoom 10, filed as Carto's `text-poly-low-zoom`
  # files them: by its own few keys, in its own order, and never a building's.
  # It tries the forests, military land and farmland first, then a danger
  # area, then the natural land, then an island, then a protected area, and
  # last a nature reserve, and nothing else claims an area there: a national
  # park that is also a park, or an island that is also grass, is named as
  # the national park or the island, where from zoom 10 it is a park or grass.
  # Farmland, a glacier and water claim their areas but are not kept: Carto
  # names no farmland before zoom 10, and the basemap names glaciers and water.
  - source: osm
    geometry: polygon_point_on_surface
    min_zoom: &low_zoom_named_area_zoom
    - if: '${ feature.area("z0 tile2") * 65536.0 * 256.0 > 3000.0 }'
      value: 4
    - if: '${ feature.area("z0 tile2") * 65536.0 * 1024.0 > 3000.0 }'
      value: 5
    - if: '${ feature.area("z0 tile2") * 65536.0 * 4096.0 > 3000.0 }'
      value: 6
    - if: '${ feature.area("z0 tile2") * 65536.0 * 16384.0 > 3000.0 }'
      value: 7
    - if: '${ feature.area("z0 tile2") * 65536.0 * 65536.0 > 3000.0 }'
      value: 8
    - if: '${ feature.area("z0 tile2") * 65536.0 * 262144.0 > 3000.0 }'
      value: 9
    # Too small to name before zoom 10, where the features above take it.
    - else: 10
    max_zoom: 9
    include_when:
      landuse: [forest, military]
    exclude_when: &unnamed_or_any_building
      __any__:
      - name: ''
      - building: __any__
    attributes: *named_area
  - source: osm
    geometry: polygon_point_on_surface
    min_zoom: *low_zoom_named_area_zoom
    max_zoom: 9
    include_when:
      military: danger_area
    exclude_when:
      __any__:
      - *unnamed_or_any_building
      - landuse: &low_zoom_landuse [forest, military, farmland]
    attributes: *named_area
  - source: osm
    geometry: polygon_point_on_surface
    min_zoom: *low_zoom_named_area_zoom
    max_zoom: 9
    include_when:
      natural: [wood, sand, scree, shingle, bare_rock]
    exclude_when:
      __any__:
      - *unnamed_or_any_building
      - landuse: *low_zoom_landuse
      - military: danger_area
    attributes: *named_area
  - source: osm
    geometry: polygon_point_on_surface
    min_zoom: *low_zoom_named_area_zoom
    max_zoom: 9
    include_when:
      place: island
    exclude_when: &low_zoom_before_place
      __any__:
      - *unnamed_or_any_building
      - landuse: *low_zoom_landuse
      - military: danger_area
      - natural: [wood, glacier, sand, scree, shingle, bare_rock, water]
    attributes: *named_area
  - source: osm
    geometry: polygon_point_on_surface
    min_zoom: *low_zoom_named_area_zoom
    max_zoom: 9
    include_when:
      __any__:
      - boundary: [aboriginal_lands, national_park]
      - __all__:
        - boundary: protected_area
        - protect_class: *carto_protect_class
    exclude_when: &low_zoom_before_boundary
      __any__:
      - *low_zoom_before_place
      - place: island
    attributes: *protected_area
  - source: osm
    geometry: polygon_point_on_surface
    min_zoom: *low_zoom_named_area_zoom
    max_zoom: 9
    include_when:
      leisure: nature_reserve
    exclude_when:
      __any__:
      - *low_zoom_before_boundary
      - boundary: [aboriginal_lands, national_park]
      - __all__:
        - boundary: protected_area
        - protect_class: *carto_protect_class
    attributes: *named_area

  - source: osm
    geometry: point
    min_zoom: 15
    include_when:
      barrier:
      - bollard
      - gate
      - lift_gate
      - swing_gate
      - block
      - log
      - cattle_grid
      - stile
      - motorcycle_barrier
      - cycle_barrier
      - full-height_turnstile
      - turnstile
      - kissing_gate
      - toll_booth
    attributes:
    - key: kind
      tag_value: barrier
    - *name
    - *name_en
    - *name_de
    - *name_fr
    - *name_es
    - *name_it
    - *name_ru
    - *name_pl
    - *name_uk

  - source: osm
    geometry: point
    min_zoom: 15
    include_when: &man_made
      man_made:
      - ceremonial_gate
      - chimney
      - communications_tower
      - crane
      - lighthouse
      - mast
      - obelisk
      - silo
      - storage_tank
      - telescope
      - tower
      - wastewater_plant
      - water_tower
      - water_works
      - windmill
      - works
      - cross
    exclude_when: &on_a_roof
      location:
      - roof
      - rooftop
    attributes: &man_made_attributes
    - key: kind
      tag_value: man_made
    - *name
    - *name_en
    - *name_de
    - *name_fr
    - *name_es
    - *name_it
    - *name_ru
    - *name_pl
    - *name_uk
  - source: osm
    geometry: polygon_point_on_surface
    min_zoom: 15
    include_when: *man_made
    exclude_when: *on_a_roof
    attributes: *man_made_attributes

  - source: osm
    geometry: point
    min_zoom: 15
    include_when: &office
      office: __any__
    attributes: &office_attributes
    - key: kind
      value: office
    - *name
    - *name_en
    - *name_de
    - *name_fr
    - *name_es
    - *name_it
    - *name_ru
    - *name_pl
    - *name_uk
  - source: osm
    geometry: polygon_point_on_surface
    min_zoom: 15
    include_when: *office
    attributes: *office_attributes

  # The basemap keeps an information point without its type, which is what
  # Carto draws it by.
  - source: osm
    geometry: point
    min_zoom: 15
    include_when: &information
      __all__:
      - tourism: information
      - information:
        - audioguide
        - board
        - guidepost
        - office
        - map
        - tactile_map
        - terminal
    attributes: &information_attributes
    - key: kind
      value: information
    - key: kind_detail
      tag_value: information
    - key: elevation
      tag_value: ele
      type: double
    - *name
    - *name_en
    - *name_de
    - *name_fr
    - *name_es
    - *name_it
    - *name_ru
    - *name_pl
    - *name_uk
  - source: osm
    geometry: polygon_point_on_surface
    min_zoom: 15
    include_when: *information
    attributes: *information_attributes

  - source: osm
    geometry: point
    min_zoom: 15
    include_when:
      __all__:
      - amenity: vending_machine
      - vending:
        - excrement_bags
        - parking_tickets
        - public_transport_tickets
    attributes:
    - key: kind
      value: vending_machine
    - key: kind_detail
      tag_value: vending

  - source: osm
    geometry: point
    min_zoom: 15
    include_when:
      waterway: waterfall
    attributes:
    - key: kind
      value: waterfall
    - *name
    - *name_en
    - *name_de
    - *name_fr
    - *name_es
    - *name_it
    - *name_ru
    - *name_pl
    - *name_uk

  # The stops Carto draws from zoom 12: a railway station, from 13 a halt and
  # from 14 a tram stop. The basemap keeps a station from zoom 15 and without
  # its `station` tag, by which Carto holds a subway's back a zoom; here it
  # is the `kind_detail`. From zoom 15 the map draws these in the basemap's
  # place (`VectorTilePoints.Superseding`).
  - source: osm
    geometry: point
    min_zoom: 12
    include_when: &railway_station
      railway: station
    attributes: &station_attributes
    - key: kind
      type: match_value
    - key: kind_detail
      tag_value: station
    - *name
    - *name_en
    - *name_de
    - *name_fr
    - *name_es
    - *name_it
    - *name_ru
    - *name_pl
    - *name_uk
  - source: osm
    geometry: polygon_point_on_surface
    min_zoom: 12
    include_when: *railway_station
    attributes: *station_attributes
  - source: osm
    geometry: point
    min_zoom: 13
    include_when: &railway_halt
      railway: halt
    attributes: *station_attributes
  - source: osm
    geometry: polygon_point_on_surface
    min_zoom: 13
    include_when: *railway_halt
    attributes: *station_attributes
  - source: osm
    geometry: point
    min_zoom: 14
    include_when: &tram_stop
      railway: tram_stop
    attributes: *station_attributes
  - source: osm
    geometry: polygon_point_on_surface
    min_zoom: 14
    include_when: *tram_stop
    attributes: *station_attributes

  # A lift's stations, which the basemap has no kind for: a `station` whose
  # `kind_detail` says it is a lift's, from zoom 13.
  - source: osm
    geometry: point
    min_zoom: 13
    include_when: &lift_station
      aerialway: station
    exclude_when: &railway_stop
      railway: [station, halt, tram_stop]
    attributes: &lift_station_attributes
    - key: kind
      value: station
    - key: kind_detail
      value: aerialway
    - *name
    - *name_en
    - *name_de
    - *name_fr
    - *name_es
    - *name_it
    - *name_ru
    - *name_pl
    - *name_uk
  - source: osm
    geometry: polygon_point_on_surface
    min_zoom: 13
    include_when: *lift_station
    exclude_when: *railway_stop
    attributes: *lift_station_attributes

  # Mountain huts, which Carto marks from zoom 13 and the basemap keeps from
  # 15, and as a restaurant where a hut is tagged as one too: Carto asks a
  # point's `tourism` before its `amenity`. Kept at every zoom, so the map can
  # draw the hut in the basemap's point's place.
  - source: osm
    geometry: point
    min_zoom: 13
    include_when: &hut
      tourism: [alpine_hut, wilderness_hut]
    attributes: &hut_attributes
    - key: kind
      type: match_value
    - key: elevation
      tag_value: ele
      type: double
    - key: access
      tag_value: access
    - *name
    - *name_en
    - *name_de
    - *name_fr
    - *name_es
    - *name_it
    - *name_ru
    - *name_pl
    - *name_uk
  - source: osm
    geometry: polygon_point_on_surface
    min_zoom: 13
    include_when: *hut
    attributes: *hut_attributes

  # A castle, a monument or a wayside cross that is also tagged as an
  # attraction, which the basemap files as the attraction: Carto asks for the
  # `historic` first.
  - source: osm
    geometry: point
    min_zoom: 15
    include_when: &historic_attraction
      __all__:
      - historic: [castle, fort, manor, monument, memorial, archaeological_site, city_gate, wayside_cross, wayside_shrine]
      - tourism: attraction
    attributes: &historic_attributes
    - key: kind
      tag_value: historic
    - *name
    - *name_en
    - *name_de
    - *name_fr
    - *name_es
    - *name_it
    - *name_ru
    - *name_pl
    - *name_uk
  - source: osm
    geometry: polygon_point_on_surface
    min_zoom: 15
    include_when: *historic_attraction
    attributes: *historic_attributes

  # Summits at the zooms the basemap has almost none, 11 and 12, where Carto
  # marks every one without its name; volcanoes until the basemap's at 15;
  # springs and capes at 14, a zoom before the basemap's. None is kept where
  # the basemap takes over.
  - source: osm
    geometry: point
    min_zoom: 11
    max_zoom: 12
    include_when:
      natural: peak
    attributes:
    - key: kind
      value: peak
    - key: elevation
      tag_value: ele
      type: double
  - source: osm
    geometry: point
    min_zoom: 11
    max_zoom: 14
    include_when:
      natural: volcano
    attributes:
    - key: kind
      value: volcano
    - key: elevation
      tag_value: ele
      type: double
    - *name
    - *name_en
    - *name_de
    - *name_fr
    - *name_es
    - *name_it
    - *name_ru
    - *name_pl
    - *name_uk
  - source: osm
    geometry: point
    min_zoom: 14
    max_zoom: 14
    include_when:
      natural: [spring, cape]
    attributes:
    - key: kind
      type: match_value
    - *name
    - *name_en
    - *name_de
    - *name_fr
    - *name_es
    - *name_it
    - *name_ru
    - *name_pl
    - *name_uk

  # A pass marked on a road or a path rather than as a saddle, and a ford,
  # neither of which the basemap has a kind for.
  - source: osm
    geometry: point
    min_zoom: 15
    include_when:
      mountain_pass: 'yes'
    exclude_when:
      natural: [saddle, peak, volcano]
    attributes:
    - key: kind
      value: mountain_pass
    - key: elevation
      tag_value: ele
      type: double
    - *name
    - *name_en
    - *name_de
    - *name_fr
    - *name_es
    - *name_it
    - *name_ru
    - *name_pl
    - *name_uk
  - source: osm
    geometry: point
    min_zoom: 15
    include_when:
      ford: ['yes', stepping_stones]
    attributes:
    - key: kind
      value: ford

# Fences, hedges and walls, which Carto draws from zoom 16, city walls from 15.
- id: barriers
  features:
  - source: osm
    geometry: line
    min_zoom: 15
    include_when:
      barrier:
      - chain
      - city_wall
      - ditch
      - fence
      - guard_rail
      - handrail
      - hedge
      - retaining_wall
      - wall
      - jersey_barrier
    attributes:
    - key: kind
      tag_value: barrier
  - source: osm
    geometry: line
    min_zoom: 15
    include_when:
      historic: citywalls
    attributes:
    - key: kind
      value: city_wall

# One-way streets and paths, for their arrows (`VectorTileArrows`), which
# Carto draws from zoom 16. The basemap's roads carry `oneway`, but its
# build merges a road's pieces and turns one around where that joins it, so
# the arrows would point back. Here every way is a line of its own, its nodes
# in OpenStreetMap's order: travelled along it for `yes`, against it for
# `-1`. A roundabout is one-way unless tagged otherwise, as Carto takes one.
# `kind` is the way's `highway`, and only the highways Carto puts arrows on
# are kept: `VectorTileArrows.Kind.byHighway`, which a test holds to this
# list.
- id: oneways
  features:
  - source: osm
    geometry: line
    min_zoom: 15
    include_when:
      __all__:
      - highway: &arrowed [motorway, motorway_link, trunk, trunk_link, primary, primary_link, secondary, secondary_link, tertiary, tertiary_link, residential, unclassified, road, service, living_street, pedestrian, footway, path, steps, cycleway, track, bridleway]
      - oneway: ['yes', '-1']
    attributes:
    - key: kind
      tag_value: highway
    - key: oneway
      tag_value: oneway
  - source: osm
    geometry: line
    min_zoom: 15
    include_when:
      __all__:
      - highway: *arrowed
      - junction: roundabout
    exclude_when:
      oneway: ['yes', '-1', 'no', reversible]
    attributes:
    - key: kind
      tag_value: highway
    - key: oneway
      value: 'yes'

# Every path and track, as a line of its own with what Carto draws it by,
# all of which the basemap drops: a track's grade, a path's surface, whether
# it is closed to those it is for, and whether a path is a cycleway or a
# bridleway by designation. The basemap joins a road's ways into one line, so
# none of this can be said of its paths by their ids, as it is of its areas:
# where a tile has these, the map draws its paths from them and none of the
# basemap's. `kind` is the feature Carto's roads query makes of the way
# (`carto_path_type`), and `access` is `no` where its `carto_highway_int_access`
# is, which reads the tag of whoever the way is for before `access`. From the
# zoom Carto first draws each.
- id: paths
  features:
  - source: osm
    geometry: line
    min_zoom: 14
    include_when:
      __any__:
      - highway: footway
      - __all__:
        - highway: path
        - __not__:
            bicycle: designated
        - __not__:
            horse: designated
    exclude_when: &is_area
      area: 'yes'
    attributes:
    - key: kind
      value: footway
    - &closed_on_foot
      key: access
      value: 'no'
      include_when:
        __any__:
        - foot: &closing ['no', permit, private, agricultural, forestry, 'agricultural;forestry']
        - __all__:
          - __any__:
            - __not__:
                foot: __any__
            - foot: unknown
          - access: *closing
    - *paved
    - *unpaved
    - *is_bridge
    - *is_tunnel
  - source: osm
    geometry: line
    min_zoom: 14
    include_when:
      highway: steps
    exclude_when: *is_area
    attributes:
    - key: kind
      value: steps
    - *closed_on_foot
    - *is_bridge
    - *is_tunnel
  - source: osm
    geometry: line
    min_zoom: 13
    include_when:
      __any__:
      - highway: cycleway
      - __all__:
        - highway: path
        - bicycle: designated
    exclude_when: *is_area
    attributes:
    - key: kind
      value: cycleway
    - key: access
      value: 'no'
      include_when:
        __any__:
        - bicycle: *closing
        - __all__:
          - __any__:
            - __not__:
                bicycle: __any__
            - bicycle: unknown
          - access: *closing
    - *paved
    - *unpaved
    - *is_bridge
    - *is_tunnel
  - source: osm
    geometry: line
    min_zoom: 13
    include_when:
      __any__:
      - highway: bridleway
      - __all__:
        - highway: path
        - horse: designated
        - __not__:
            bicycle: designated
    exclude_when: *is_area
    attributes:
    - key: kind
      value: bridleway
    - key: access
      value: 'no'
      include_when:
        __any__:
        - horse: *closing
        - __all__:
          - __any__:
            - __not__:
                horse: __any__
            - horse: unknown
          - access: *closing
    - *is_bridge
    - *is_tunnel
  - source: osm
    geometry: line
    min_zoom: 13
    include_when:
      highway: track
    exclude_when: *is_area
    attributes:
    - key: kind
      value: track
    - key: tracktype
      tag_value: tracktype
      include_when:
        tracktype: [grade1, grade2, grade3, grade4, grade5]
    - key: access
      value: 'no'
      include_when:
        access: *closing
    - *is_bridge
    - *is_tunnel

# Service roads, as lines of their own, to tell the driveways, parking aisles
# and drive-throughs from the roads that serve a place: Carto draws those
# three narrower and only from zoom 16, and the basemap keeps no `service`
# on a road. Where a tile has these, the map draws its service roads from
# them and none of the basemap's. The rest from zoom 14, where Carto first
# draws one.
- id: service_roads
  features:
  - source: osm
    geometry: line
    min_zoom: 14
    include_when:
      highway: service
    exclude_when:
      __any__:
      - area: 'yes'
      - service: &minor_services [parking_aisle, drive-through, driveway]
    attributes:
    - *is_bridge
    - *is_tunnel
  - source: osm
    geometry: line
    min_zoom: 15
    include_when:
      __all__:
      - highway: service
      - service: *minor_services
    exclude_when: *is_area
    attributes:
    - key: service
      tag_value: service
    - *is_bridge
    - *is_tunnel

# Roads being built, which the basemap leaves out: the road each is to be,
# from the zoom Carto first draws one of that class.
- id: construction
  features:
  - source: osm
    geometry: line
    min_zoom: 12
    include_when:
      __all__:
      - highway: construction
      - construction: [motorway, trunk, primary, secondary]
    attributes: &construction_kind
    - key: kind
      tag_value: construction
  - source: osm
    geometry: line
    min_zoom: 13
    include_when:
      __all__:
      - highway: construction
      - construction: [motorway_link, trunk_link, primary_link, secondary_link, tertiary]
    attributes: *construction_kind
  - source: osm
    geometry: line
    min_zoom: 14
    include_when:
      __all__:
      - highway: construction
      - construction: [tertiary_link, residential, unclassified]
    attributes: *construction_kind
  - source: osm
    geometry: line
    min_zoom: 14
    include_when:
      highway: construction
    exclude_when:
      construction: __any__
    attributes:
    - key: kind
      value: residential

# Power lines, which Carto draws from zoom 14, and the minor ones from 16.
- id: power
  features:
  - source: osm
    geometry: line
    min_zoom: 14
    include_when:
      power: line
    attributes:
    - key: kind
      value: line
  - source: osm
    geometry: line
    min_zoom: 15
    include_when:
      power: minor_line
    attributes:
    - key: kind
      value: minor_line

# The towers a power line hangs from, which Carto draws from zoom 14, and
# the poles of a minor one, from 16.
- id: power_points
  features:
  - source: osm
    geometry: point
    min_zoom: 14
    include_when:
      power: tower
    attributes:
    - key: kind
      value: tower
  - source: osm
    geometry: point
    min_zoom: 15
    include_when:
      power: pole
    attributes:
    - key: kind
      value: pole

# Dams, weirs and lock gates mapped as lines, which Carto draws from zoom 13.
# The basemap has the dams mapped as areas.
- id: dams
  features:
  - source: osm
    geometry: line
    min_zoom: 13
    include_when:
      waterway: [dam, weir, lock_gate]
    attributes:
    - key: kind
      type: match_value

# Breakwaters and groynes, mapped as a line or as an area, which Carto draws
# from zoom 12 and the basemap has no kind for.
- id: breakwaters
  features:
  - source: osm
    geometry: line
    min_zoom: 12
    include_when:
      man_made: [breakwater, groyne]
    attributes:
    - key: kind
      type: match_value
  - source: osm
    geometry: polygon
    min_zoom: 12
    include_when:
      man_made: [breakwater, groyne]
    attributes:
    - key: kind
      type: match_value

# Ridges and arêtes, which Carto draws from zoom 14 and names from 15.
- id: ridges
  features:
  - source: osm
    geometry: line
    min_zoom: 14
    include_when:
      natural: [ridge, arete]
    attributes:
    - key: kind
      type: match_value
    - *name
    - *name_en
    - *name_de
    - *name_fr
    - *name_es
    - *name_it
    - *name_ru
    - *name_pl
    - *name_uk

# Cliffs, which Carto draws from zoom 13, and embankments, from 15: a line
# with teeth down the side that falls away, which is the right of the way's
# own direction. So every way is a line of its own here, its nodes in
# OpenStreetMap's order, as the one-way streets are; the basemap keeps the
# cliffs and none of the embankments.
- id: cliffs
  features:
  - source: osm
    geometry: line
    min_zoom: 13
    include_when:
      natural: cliff
    attributes:
    - key: kind
      value: cliff
  - source: osm
    geometry: line
    min_zoom: 15
    include_when:
      man_made: embankment
    attributes:
    - key: kind
      value: embankment

# The lines cut through a forest, which Carto draws from zoom 14.
- id: cutlines
  features:
  - source: osm
    geometry: line
    min_zoom: 14
    include_when:
      man_made: cutline
    attributes:
    - key: kind
      value: cutline

# Rows of trees and single trees, which Carto draws from zoom 16.
- id: trees
  features:
  - source: osm
    geometry: line
    min_zoom: 15
    include_when:
      natural: tree_row
    attributes:
    - key: kind
      value: tree_row
  - source: osm
    geometry: point
    min_zoom: 15
    include_when:
      natural: tree
    attributes:
    - key: kind
      value: tree

# Water that is not always there, which Carto draws broken: a stream or a
# river as dashes, a lake as a pattern. The basemap draws both as any water
# and joins a stream's pieces whether or not each runs all year, so these
# say where to break its lines and which of its lakes to draw through. Each
# comes in at the zoom the basemap first has it.
- id: intermittent
  features:
  - source: osm
    geometry: line
    min_zoom:
      default_value: 15
      overrides:
        9:
          waterway: river
        10:
          waterway: canal
        13:
          waterway: stream
    include_when:
      __all__:
      - waterway: [river, canal, stream, ditch, drain]
      - &is_intermittent
        __any__:
        - intermittent: 'yes'
        - seasonal: ['yes', spring, summer, autumn, winter, wet_season, dry_season]
    exclude_when:
      tunnel: ['yes', culvert, flooded]
    attributes:
    - key: kind
      tag_value: waterway
  - source: osm
    geometry: polygon
    min_zoom: 6
    min_size: 2
    include_when:
      __all__:
      - __any__:
        - natural: water
        - landuse: [reservoir, basin]
        - waterway: [dock, riverbank]
      - *is_intermittent
    attributes:
    - key: kind
      value: water

# The names of buildings, at a point inside each with its size: Carto names
# a building from zoom 14 once it covers 3,000 square pixels, and every one
# from zoom 17. The basemap names a building only as the shop, the hut or
# the church in it.
- id: building_names
  features:
  - source: osm
    geometry: polygon_point_on_surface
    min_zoom:
    - if: '${ feature.area("z0 tile2") * 65536.0 * 268435456.0 > 3000.0 }'
      value: 14
    - else: 15
    include_when:
      building: __any__
    exclude_when:
      __any__:
      - name: ''
      - building: 'no'
    attributes:
    - *area
    - *name
    - *name_en
    - *name_de
    - *name_fr
    - *name_es
    - *name_it
    - *name_ru
    - *name_pl
    - *name_uk
