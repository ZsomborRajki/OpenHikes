# The vector extras: what OpenStreetMap Carto draws and the Protomaps basemap
# on tiles.openhikes.app leaves out, as a second PMTiles archive the app
# draws into the same tiles (`VectorTileSource.extras`).
#
# Its layers and attributes are named as the basemap's are — `landuse` and
# `pois` with `kind`, `kind_detail` and `name:<language>` — so a tile of each
# merges into one and is read by the same code. `barriers` is the one layer
# of its own, and an unnamed car park's `access` the one attribute. Every
# feature waits for zoom 14 or 15: the map draws deeper zooms from zoom 15,
# and Carto draws none of these wider.
#
# Scripts/lib/vector-extras.filter cuts the planet down to these tags first;
# change both together. Built by Scripts/vector-extras.sh.
schema_name: OpenHikes extras
schema_description: OpenStreetMap features the Protomaps basemap leaves out, for the OpenHikes map.
attribution: <a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap contributors</a>
args:
  osm_path:
    description: The planet cut down by Scripts/lib/vector-extras.filter
    default: extras.osm.pbf
sources:
  osm:
    type: osm
    local_path: '${ args.osm_path }'
definitions:
  attributes:
  - &name
    key: name
  - &name_en
    key: 'name:en'
    tag_value: 'name:en'
  - &name_de
    key: 'name:de'
    tag_value: 'name:de'
  - &name_fr
    key: 'name:fr'
    tag_value: 'name:fr'
  - &name_es
    key: 'name:es'
    tag_value: 'name:es'
  - &name_it
    key: 'name:it'
    tag_value: 'name:it'
  - &name_ru
    key: 'name:ru'
    tag_value: 'name:ru'
  - &name_pl
    key: 'name:pl'
    tag_value: 'name:pl'
  - &name_uk
    key: 'name:uk'
    tag_value: 'name:uk'
layers:
# Car parks, which the basemap has no fill for at all.
- id: landuse
  features:
  - source: osm
    geometry: polygon
    min_zoom: 14
    include_when:
      amenity: parking
    exclude_when:
      parking: underground
    attributes:
    - key: kind
      value: parking

- id: pois
  features:
  # A car park mapped as an area with no name: the basemap keeps an area's
  # point only when it is named, and keeps the named ones already. Its access
  # is kept because Carto fades a car park that is private or for customers.
  - source: osm
    geometry: polygon_point_on_surface
    min_zoom: 14
    include_when:
      amenity: parking
    exclude_when:
      name: __any__
      parking: underground
    attributes:
    - key: kind
      value: parking
    - key: access
      tag_value: access

  - source: osm
    geometry: point
    min_zoom: 15
    include_when:
      barrier:
      - bollard
      - gate
      - lift_gate
      - swing_gate
      - block
      - log
      - cattle_grid
      - stile
      - motorcycle_barrier
      - cycle_barrier
      - full-height_turnstile
      - turnstile
      - kissing_gate
      - toll_booth
    attributes:
    - key: kind
      tag_value: barrier
    - *name
    - *name_en
    - *name_de
    - *name_fr
    - *name_es
    - *name_it
    - *name_ru
    - *name_pl
    - *name_uk

  - source: osm
    geometry: point
    min_zoom: 15
    include_when: &man_made
      man_made:
      - ceremonial_gate
      - chimney
      - communications_tower
      - crane
      - lighthouse
      - mast
      - obelisk
      - silo
      - storage_tank
      - telescope
      - tower
      - wastewater_plant
      - water_tower
      - water_works
      - windmill
      - works
      - cross
    exclude_when: &on_a_roof
      location:
      - roof
      - rooftop
    attributes: &man_made_attributes
    - key: kind
      tag_value: man_made
    - *name
    - *name_en
    - *name_de
    - *name_fr
    - *name_es
    - *name_it
    - *name_ru
    - *name_pl
    - *name_uk
  - source: osm
    geometry: polygon_point_on_surface
    min_zoom: 15
    include_when: *man_made
    exclude_when: *on_a_roof
    attributes: *man_made_attributes

  - source: osm
    geometry: point
    min_zoom: 15
    include_when: &office
      office: __any__
    attributes: &office_attributes
    - key: kind
      value: office
    - *name
    - *name_en
    - *name_de
    - *name_fr
    - *name_es
    - *name_it
    - *name_ru
    - *name_pl
    - *name_uk
  - source: osm
    geometry: polygon_point_on_surface
    min_zoom: 15
    include_when: *office
    attributes: *office_attributes

  # The basemap keeps an information point without its type, which is what
  # Carto draws it by.
  - source: osm
    geometry: point
    min_zoom: 15
    include_when: &information
      __all__:
      - tourism: information
      - information:
        - audioguide
        - board
        - guidepost
        - office
        - map
        - tactile_map
        - terminal
    attributes: &information_attributes
    - key: kind
      value: information
    - key: kind_detail
      tag_value: information
    - key: elevation
      tag_value: ele
      type: double
    - *name
    - *name_en
    - *name_de
    - *name_fr
    - *name_es
    - *name_it
    - *name_ru
    - *name_pl
    - *name_uk
  - source: osm
    geometry: polygon_point_on_surface
    min_zoom: 15
    include_when: *information
    attributes: *information_attributes

  - source: osm
    geometry: point
    min_zoom: 15
    include_when:
      __all__:
      - amenity: vending_machine
      - vending:
        - excrement_bags
        - parking_tickets
        - public_transport_tickets
    attributes:
    - key: kind
      value: vending_machine
    - key: kind_detail
      tag_value: vending

  - source: osm
    geometry: point
    min_zoom: 15
    include_when:
      waterway: waterfall
    attributes:
    - key: kind
      value: waterfall
    - *name
    - *name_en
    - *name_de
    - *name_fr
    - *name_es
    - *name_it
    - *name_ru
    - *name_pl
    - *name_uk

# Fences, hedges and walls, which Carto draws from zoom 16, city walls from 15.
- id: barriers
  features:
  - source: osm
    geometry: line
    min_zoom: 15
    include_when:
      barrier:
      - chain
      - city_wall
      - ditch
      - fence
      - guard_rail
      - handrail
      - hedge
      - retaining_wall
      - wall
      - jersey_barrier
    attributes:
    - key: kind
      tag_value: barrier
  - source: osm
    geometry: line
    min_zoom: 15
    include_when:
      historic: citywalls
    attributes:
    - key: kind
      value: city_wall
