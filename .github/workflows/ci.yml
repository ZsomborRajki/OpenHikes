name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  IOS_DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro

jobs:
  quality:
    name: Lint and shared package
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned SwiftLint
        run: |
          curl --fail --location --retry 3 \
            --output SwiftLint.pkg \
            https://github.com/realm/SwiftLint/releases/download/0.65.0/SwiftLint.pkg
          echo "825e687d618e17d24bd5fad6d2cf98d4c32a157940ad5b7ce8ae4d722d6afb3a  SwiftLint.pkg" \
            | shasum --algorithm 256 --check
          sudo installer -pkg SwiftLint.pkg -target /
          rm SwiftLint.pkg

      - name: Run strict SwiftLint
        run: swiftlint lint --strict --quiet

      - name: Test shared package
        run: swift test --package-path OpenTrailsShared -Xswiftc -warnings-as-errors

      - name: Verify resolved packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project OpenTrails.xcodeproj \
            -scheme OpenTrails \
            -skipPackagePluginValidation \
            -quiet
          git diff --exit-code -- \
            OpenTrails.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

  unit-tests:
    name: App and widget tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run tests with strict suite preconditions
        run: |
          mkdir -p TestResults
          xcodebuild test \
            -project OpenTrails.xcodeproj \
            -scheme OpenTrails \
            -destination "$IOS_DESTINATION" \
            -only-testing:OpenTrailsTests \
            -only-testing:OpenWidgetTests \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults/UnitTests.xcresult \
            -skipPackagePluginValidation \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) REQUIRE_ALL_SUITES' \
            -quiet

      - name: Print coverage report
        run: xcrun xccov view --report TestResults/UnitTests.xcresult

  builds:
    name: ${{ matrix.name }}
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS Debug build
            configuration: Debug
            destination: generic/platform=iOS Simulator
            disable_code_signing: false
          - name: iOS Release build
            configuration: Release
            destination: generic/platform=iOS Simulator
            disable_code_signing: false
          - name: macOS Debug build
            configuration: Debug
            destination: generic/platform=macOS
            disable_code_signing: true
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          code_signing=()
          if [[ "${{ matrix.disable_code_signing }}" == "true" ]]; then
            code_signing+=(CODE_SIGNING_ALLOWED=NO)
          fi
          xcodebuild build \
            -project OpenTrails.xcodeproj \
            -scheme OpenTrails \
            -configuration "${{ matrix.configuration }}" \
            -destination "${{ matrix.destination }}" \
            -skipPackagePluginValidation \
            "${code_signing[@]}" \
            -quiet

  gpx-thread-sanitizer:
    name: GPX thread sanitizer
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run concurrent GPX imports under TSan
        run: |
          xcodebuild test \
            -project OpenTrails.xcodeproj \
            -scheme OpenTrails \
            -destination "$IOS_DESTINATION" \
            -only-testing:OpenTrailsTests/GPXImportTests \
            -only-testing:OpenTrailsTests/GPXImportDateTests \
            -enableThreadSanitizer YES \
            -parallel-testing-enabled NO \
            -skipPackagePluginValidation \
            -quiet

  ui-tests:
    name: UI automation and launch metrics
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run UI tests
        run: |
          xcrun simctl location booted clear >/dev/null 2>&1 || true
          xcodebuild test \
            -project OpenTrails.xcodeproj \
            -scheme OpenTrailsUI \
            -destination "$IOS_DESTINATION" \
            -only-testing:OpenTrailsUITests \
            -skipPackagePluginValidation \
            -quiet
