name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  IOS_SIMULATOR: iPhone 17 Pro
  IOS_DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro

jobs:
  quality:
    name: Lint and shared package
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned SwiftLint
        run: |
          version="$(cat .swiftlint-version)"
          curl --fail --location --retry 3 \
            --output SwiftLint.pkg \
            "https://github.com/realm/SwiftLint/releases/download/${version}/SwiftLint.pkg"
          echo "825e687d618e17d24bd5fad6d2cf98d4c32a157940ad5b7ce8ae4d722d6afb3a  SwiftLint.pkg" \
            | shasum --algorithm 256 --check
          sudo installer -pkg SwiftLint.pkg -target /
          rm SwiftLint.pkg

      # The same script a developer runs locally, and the same one the
      # opt-in pre-push hook runs — so a violation cannot be green in one
      # place and red in another.
      - name: Run strict SwiftLint
        run: Scripts/lint.sh

      - name: Test shared package
        run: swift test --package-path OpenHikesShared -Xswiftc -warnings-as-errors

      - name: Verify resolved packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project OpenHikes.xcodeproj \
            -scheme OpenHikes \
            -skipPackagePluginValidation \
            -quiet
          git diff --exit-code -- \
            OpenHikes.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

  unit-tests:
    name: App and widget tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project OpenHikes.xcodeproj \
            -scheme OpenHikes \
            -destination "$IOS_DESTINATION" \
            -derivedDataPath DerivedData \
            -skipPackagePluginValidation \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) REQUIRE_ALL_SUITES' \
            -quiet

      # Booted as its own step so the first test launch does not pay for it.
      # A cold simulator is a known source of "Early unexpected exit, operation
      # never finished bootstrapping": the host app is killed by the watchdog
      # that is timing its launch, and the run fails without a single test
      # having reported anything.
      - name: Boot the simulator
        run: |
          xcrun simctl boot "$IOS_SIMULATOR" || true
          xcrun simctl bootstatus "$IOS_SIMULATOR" -b

      - name: Run tests with strict suite preconditions
        run: |
          mkdir -p TestResults
          xcodebuild test-without-building \
            -project OpenHikes.xcodeproj \
            -scheme OpenHikes \
            -destination "$IOS_DESTINATION" \
            -derivedDataPath DerivedData \
            -only-testing:OpenHikesTests \
            -only-testing:OpenWidgetTests \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults/UnitTests.xcresult \
            -skipPackagePluginValidation

      # Deliberately not `-quiet`: the output is one line per test, and a
      # failing one carries its assertion text. The result bundle below is the
      # backstop for a failure that prints no such line — a crash or a hang.
      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-xcresult
          path: TestResults/UnitTests.xcresult
          retention-days: 7

      - name: Print coverage report
        run: xcrun xccov view --report TestResults/UnitTests.xcresult

  builds:
    name: ${{ matrix.name }}
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS Debug build
            configuration: Debug
            destination: generic/platform=iOS Simulator
          - name: iOS Release build
            configuration: Release
            destination: generic/platform=iOS Simulator
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild build \
            -project OpenHikes.xcodeproj \
            -scheme OpenHikes \
            -configuration "${{ matrix.configuration }}" \
            -destination "${{ matrix.destination }}" \
            -skipPackagePluginValidation \
            -quiet

  gpx-thread-sanitizer:
    name: GPX thread sanitizer
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Boot the simulator
        run: |
          xcrun simctl boot "$IOS_SIMULATOR" || true
          xcrun simctl bootstatus "$IOS_SIMULATOR" -b

      - name: Run concurrent GPX imports under TSan
        run: |
          mkdir -p TestResults
          xcodebuild test \
            -project OpenHikes.xcodeproj \
            -scheme OpenHikes \
            -destination "$IOS_DESTINATION" \
            -only-testing:OpenHikesTests/GPXImportTests \
            -only-testing:OpenHikesTests/GPXImportDateTests \
            -enableThreadSanitizer YES \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults/ThreadSanitizer.xcresult \
            -skipPackagePluginValidation

      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: thread-sanitizer-xcresult
          path: TestResults/ThreadSanitizer.xcresult
          retention-days: 7

# UI automation and the performance suite are deliberately not run here.
# Both drive a simulator through real gestures and timing-sensitive waits, which
# a shared runner makes slow and unreliable, and `PerformanceUITests` additionally
# needs `simctl privacy grant location-always` and produces measurements that are
# only comparable against the same hardware.
#
#   Scripts/run-ui-tests.sh --all
#   Scripts/run-performance-tests.sh
