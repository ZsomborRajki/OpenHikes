name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  IOS_SIMULATOR: iPhone 17 Pro
  IOS_DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro

jobs:
  quality:
    name: Lint and shared package
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/verify-xcode

      - name: Install pinned SwiftLint
        run: |
          version="$(cat .swiftlint-version)"
          curl --fail --location --retry 3 \
            --output SwiftLint.pkg \
            "https://github.com/realm/SwiftLint/releases/download/${version}/SwiftLint.pkg"
          echo "825e687d618e17d24bd5fad6d2cf98d4c32a157940ad5b7ce8ae4d722d6afb3a  SwiftLint.pkg" \
            | shasum --algorithm 256 --check
          sudo installer -pkg SwiftLint.pkg -target /
          rm SwiftLint.pkg

      # The same script a developer runs locally, and the same one the
      # opt-in pre-push hook runs — so a violation cannot be green in one
      # place and red in another.
      - name: Run strict SwiftLint
        run: Scripts/lint.sh

      # SwiftLint sees no shell. Nothing else in this repository executes
      # ci_scripts/ci_post_clone.sh either — Xcode Cloud runs it by name, and a
      # syntax error in it would surface as a failed cloud archive rather than
      # as a failed pull request. A parse check is cheap and is the only thing
      # standing between an edit to that file and finding out in the cloud.
      #
      # Each script is parsed by the interpreter its own shebang names.
      # ci_post_clone.sh is `#!/bin/sh` and the rest are bash; checking them all
      # with `sh -n` would reject bash process substitution that is legal where
      # it is written (Scripts/run-ui-tests.sh:102, verified).
      - name: Check shell scripts parse
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r script; do
            interpreter="$(head -1 "$script" | sed -E 's|^#!(/usr/bin/env )?||; s| .*||')"
            case "$interpreter" in
              sh|bash|zsh) ;;
              *) interpreter=bash ;;
            esac
            if "$interpreter" -n "$script"; then
              echo "  ok   $script"
            else
              echo "::error file=$script::$script is not valid $interpreter syntax."
              status=1
            fi
          done < <(find Scripts ci_scripts -name '*.sh' | sort)
          exit "$status"

      - name: Test shared package
        run: |
          set -o pipefail
          swift test --package-path OpenHikesShared -Xswiftc -warnings-as-errors \
            | xcbeautify --renderer github-actions --disable-logging

      # The same suite against genuinely optimised code. This is the only place
      # in the repository where a *test* runs against `-O` and whole-module
      # optimisation: the two app-hosted bundles cannot, because 116 `@testable
      # import`s need ENABLE_TESTABILITY, and the seams they reach for —
      # `AppLaunchEnvironment.Configuration(arguments:)`, `TileLoadGate`'s
      # `TestState`, `MapEntitlement.resetForTesting()` — are inside `#if
      # DEBUG` and so do not exist in a Release build at all. Measured: 61
      # compile errors across 8 test files, and the fix would be to ship the
      # test seams. The package has no such seams and no such constraint.
      #
      # It costs seconds, not minutes, because the package is small and has no
      # external dependencies.
      - name: Test shared package in Release
        run: |
          set -o pipefail
          swift test --package-path OpenHikesShared --configuration release \
            -Xswiftc -warnings-as-errors \
            | xcbeautify --renderer github-actions --disable-logging

      - name: Verify resolved packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project OpenHikes.xcodeproj \
            -scheme OpenHikes \
            -skipPackagePluginValidation \
            -quiet
          git diff --exit-code -- \
            OpenHikes.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

  unit-tests:
    name: App and widget tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/verify-xcode

      # Piped through xcbeautify rather than run with -quiet: -quiet hides
      # compiler warnings outright, while the github-actions renderer turns
      # each one into an inline annotation on the pull request. xcbeautify
      # 3.2.1 is preinstalled on this image and is the version Homebrew
      # installs, so this output matches what Scripts/ produces locally.
      # `set -o pipefail` is mandatory — Actions runs `bash -e`, which without
      # it would report the formatter's success instead of xcodebuild's.
      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project OpenHikes.xcodeproj \
            -scheme OpenHikes \
            -destination "$IOS_DESTINATION" \
            -derivedDataPath DerivedData \
            -skipPackagePluginValidation \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) REQUIRE_ALL_SUITES' \
            | xcbeautify --renderer github-actions --disable-logging

      # Booted as its own step so the first test launch does not pay for it.
      # A cold simulator is a known source of "Early unexpected exit, operation
      # never finished bootstrapping": the host app is killed by the watchdog
      # that is timing its launch, and the run fails without a single test
      # having reported anything.
      - name: Boot the simulator
        run: |
          xcrun simctl boot "$IOS_SIMULATOR" || true
          xcrun simctl bootstatus "$IOS_SIMULATOR" -b

      - name: Run tests with strict suite preconditions
        run: |
          set -o pipefail
          mkdir -p TestResults
          xcodebuild test-without-building \
            -project OpenHikes.xcodeproj \
            -scheme OpenHikes \
            -destination "$IOS_DESTINATION" \
            -derivedDataPath DerivedData \
            -only-testing:OpenHikesTests \
            -only-testing:OpenWidgetTests \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults/UnitTests.xcresult \
            -skipPackagePluginValidation \
            | xcbeautify --renderer github-actions --disable-logging

      # xcbeautify understands Swift Testing's output, so a failing @Test keeps
      # its issue text and its file:line and gains an inline annotation. What
      # it does not print is anything at all for a failure it cannot parse — a
      # crash or a hang yields no formatted line, not even `** TEST FAILED **`.
      # The exit status still propagates through pipefail, so the job goes red
      # either way, and this bundle is the backstop for exactly that case.
      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-tests-xcresult
          path: TestResults/UnitTests.xcresult
          retention-days: 7

      # `-enableCodeCoverage YES` on the test action above is what produces
      # these numbers in CI; measured either way, the plan key changes nothing
      # here. What `codeCoverage` in OpenHikes.xctestplan buys is a developer
      # pressing ⌘U in Xcode getting the same report the gate reads, rather
      # than an empty coverage tab and a surprise on the pull request.
      #
      # The floor is a floor, not a target. `OpenHikes.app` measured 57.42%
      # line coverage when this gate was added; 55% sits far enough below that
      # adding one uncovered SwiftUI screen does not turn the build red on its
      # own, and close enough that a real fall — a suite deleted, a domain
      # stubbed out — does. Raise it when the measured number rises. Lowering
      # it to make a run pass is the one change this step exists to prevent.
      - name: Check coverage against its floor
        env:
          COVERAGE_FLOOR: "55.0"
          COVERAGE_TARGET: OpenHikes.app
        run: |
          set -o pipefail
          xcrun xccov view --report TestResults/UnitTests.xcresult
          xcrun xccov view --report --json TestResults/UnitTests.xcresult \
            > TestResults/coverage.json
          python3 - <<'PY'
          import json
          import os
          import sys

          floor = float(os.environ["COVERAGE_FLOOR"])
          wanted = os.environ["COVERAGE_TARGET"]
          report = json.load(open("TestResults/coverage.json"))
          targets = report.get("targets", [])
          target = next((t for t in targets if t.get("name") == wanted), None)

          if target is None:
              seen = ", ".join(t.get("name", "?") for t in targets) or "nothing"
              sys.exit(
                  f"::error::No {wanted} in the coverage report — saw {seen}. "
                  "Either the target was renamed or the build was not instrumented."
              )

          measured = target["lineCoverage"] * 100
          verdict = "below" if measured < floor else "at or above"
          line = (
              f"`{wanted}` line coverage **{measured:.2f}%**, "
              f"{verdict} the {floor:.2f}% floor "
              f"({target['coveredLines']}/{target['executableLines']} lines)."
          )
          print(line)

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write(line + "\n")

          if measured < floor:
              sys.exit(
                  f"::error::Coverage fell to {measured:.2f}%, under the "
                  f"{floor:.2f}% floor set in .github/workflows/ci.yml."
              )
          PY

  # Both entries build for the *simulator*. What that proves is that the code
  # compiles and links at `-Onone` and at `-O` with whole-module optimisation,
  # which is where a Release-only compile error or an optimiser-sensitive
  # `@inlinable` mistake shows up. What it does not prove is behaviour: no test
  # runs against Release here, `assertOffMainThread`'s one `assert` is compiled
  # out, and `AppLaunchEnvironment.configuration` takes its `#else` branch and
  # becomes `.production`. The `archive` job below covers the device SDK and
  # the packaging path; the `quality` job covers optimised *behaviour*, for the
  # one target that can be tested that way.
  builds:
    name: ${{ matrix.name }}
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS Debug build
            configuration: Debug
            destination: generic/platform=iOS Simulator
          - name: iOS Release build
            configuration: Release
            destination: generic/platform=iOS Simulator
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/verify-xcode

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project OpenHikes.xcodeproj \
            -scheme OpenHikes \
            -configuration "${{ matrix.configuration }}" \
            -destination "${{ matrix.destination }}" \
            -skipPackagePluginValidation \
            | xcbeautify --renderer github-actions --disable-logging

  # The only job that builds against the *device* SDK, and the only one that
  # runs the install-and-package half of a build. Three things are unique to
  # it, measured against the Release simulator build above:
  #
  #   - arm64 for a real device, rather than a simulator slice built against
  #     the simulator SDK.
  #   - `ValidateEmbeddedBinary` on OpenWidgetExtension.appex, which runs once
  #     here and zero times there. That is the check that enforces the rule the
  #     repository documents — an embedded extension's device family has to
  #     stay a subset of its host's — so nothing else in CI would catch the
  #     widget drifting away from the app's `TARGETED_DEVICE_FAMILY`.
  #   - The `InstallationBuildProductsLocation` path: strip, SetOwnerAndGroup,
  #     SetMode and bundle validation.
  #
  # (dSYM generation is *not* unique to it — Release already sets
  # `dwarf-with-dsym`, and the simulator build emits them too.)
  #
  # Two things it deliberately does *not* prove, both easy to assume it does:
  #
  #   1. Entitlement substitution. `CODE_SIGN_STYLE` is `Automatic`, so Xcode
  #      replaces `aps-environment = development` with `production` on archive
  #      — but only while signing. `CODE_SIGNING_ALLOWED=NO` skips
  #      `ProcessProductPackaging` entirely, and the archive this job produces
  #      carries no entitlements at all (verified: `codesign -d --entitlements`
  #      reports the app is not signed, and `aps-environment` appears nowhere
  #      in the bundle). Closing that would need a signing team and a
  #      provisioning profile in secrets, which is a different decision.
  #   2. `ci_scripts/ci_post_clone.sh`. Xcode Cloud runs that script by name;
  #      `xcodebuild archive` on a hosted runner never does. The `quality` job
  #      parse-checks it instead, which is as far as CI can honestly go.
  #
  # No artifact: an unsigned archive cannot be exported, and its dSYMs (32 MB)
  # match no shipped binary, so keeping them would be storage spent on
  # something nothing can symbolicate.
  archive:
    name: Unsigned iOS archive
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/verify-xcode

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project OpenHikes.xcodeproj \
            -scheme OpenHikes \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/OpenHikes.xcarchive \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcbeautify --renderer github-actions --disable-logging

      # An archive that "succeeds" without producing the app, without embedding
      # the widget, or without its dSYMs is a green job that proves nothing —
      # and all three are silent, since xcodebuild reports ARCHIVE SUCCEEDED
      # either way.
      - name: Verify the archive has what it should
        run: |
          set -euo pipefail
          app="build/OpenHikes.xcarchive/Products/Applications/OpenHikes.app"
          status=0
          for path in \
            "$app/OpenHikes" \
            "$app/PlugIns/OpenWidgetExtension.appex" \
            "build/OpenHikes.xcarchive/dSYMs/OpenHikes.app.dSYM" \
            "build/OpenHikes.xcarchive/dSYMs/OpenWidgetExtension.appex.dSYM"
          do
            if [[ -e "$path" ]]; then
              echo "  ok      $path"
            else
              echo "::error::The archive is missing $path"
              status=1
            fi
          done
          arches="$(lipo -archs "$app/OpenHikes")"
          echo "  arches  $arches"
          if [[ "$arches" != *arm64* ]]; then
            echo "::error::The archived binary has no arm64 slice — this is not a device build."
            status=1
          fi
          exit "$status"

  thread-sanitizer:
    name: Thread sanitizer
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/verify-xcode

      # A private device rather than the image's shared `iPhone 17 Pro`, and
      # deleted again below. TSan's shadow memory is the heaviest thing this
      # workflow asks a simulator to hold, and the failure it produces when the
      # machine cannot hold it is not a test failure — it is the app dying
      # before a single test runs. Starting from a device with no accumulated
      # state is the cheapest way to not be that machine.
      - name: Create a private simulator
        id: sim
        run: |
          set -euo pipefail
          udid="$(xcrun simctl create "tsan-${GITHUB_RUN_ID}" "$IOS_SIMULATOR")"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

      # The one xcodebuild call in this file that is deliberately not piped
      # through xcbeautify. A ThreadSanitizer race is reported as a plain
      # `WARNING: ThreadSanitizer: data race` block, which xcbeautify does not
      # recognise and therefore drops in full — the report this job exists to
      # produce would vanish, leaving a red run with no stack and no file. Raw
      # output is the product here, so it stays raw.
      #
      # An allow-list rather than the whole target, and rather than
      # `-skip-testing` on a few exclusions. Two reasons, in order:
      #
      #   1. TSan's shadow memory multiplies every allocation, and the suites
      #      that build an `MKMapView` per test — `MapCoordinatorTests` above
      #      all — get the host app killed by the simulator part-way through a
      #      run (`Test crashed with signal kill`, on a different test each
      #      time and with no race reported). They are also main-actor
      #      rendering code, so a sanitizer has nothing to find in them.
      #   2. What is worth sanitizing is what actually runs concurrently:
      #      `SerialAsyncQueue`'s FIFO-across-suspensions guarantee, the
      #      `Mutex` that makes `TileCache`'s bump-then-delete atomic,
      #      `AutoSaveTileStore`'s drain, the tile transport's in-flight
      #      coalescing, `PendingRecordingFixStore`'s `flock`, the
      #      `CLLocationManager` delegate hops through `onMainActor`,
      #      `CloudSyncCoordinator`'s off-main seam, and the cross-process
      #      App Group writes behind `WidgetFeedSuites`.
      #
      # A mistyped identifier here is silently ignored rather than rejected, so
      # a suite added to this list and never run looks exactly like one that
      # passes. Nested suites need their enclosing type — hence
      # `WidgetFeedSuites`, which is where `BackgroundDeliveryTests` lives and
      # which is why 31 entries resolve to 34 suites rather than 31.
      #
      # 34 is the guard: after editing this list, check the suite count in the
      # log, and if it fell, an identifier did not match. Deliberately not the
      # *test* count, which rises whenever anyone writes a test and would make
      # this comment wrong within a month — a growing test count here is the
      # expected outcome, not a failure.
      #
      # It found no races when it was widened to this list. If a run goes red
      # with no `data race` block in the log — a host-app SIGKILL landing on a
      # different test each time, or an app that dies before any test starts —
      # read the machine, not the code: that is what TSan's shadow memory looks
      # like when it meets memory pressure. Run 33118716508 is the second
      # shape: `ThreadSanitizer: SEGV`, then `pointer being freed was not
      # allocated`, then `never finished bootstrapping`, with zero tests run
      # and no race reported, while the same command on the same commit and the
      # same Xcode passed locally with 378 tests in 34 suites in 9.4 seconds.
      # That is the sanitizer runtime running out of room, not a finding.
      #
      # So exactly that shape — and nothing else — is retried below. A reported
      # race fails the job on the spot, and so does a failing test; only a run
      # that never reached its first test is attempted again. Widening this
      # condition would turn the job into one that retries until it is green,
      # which is worth less than no job at all.
      - name: Run the concurrency suites under TSan
        run: |
          set -uo pipefail
          mkdir -p TestResults

          run_tsan() {
            rm -rf TestResults/ThreadSanitizer.xcresult
            xcodebuild test \
              -project OpenHikes.xcodeproj \
              -scheme OpenHikes \
              -destination "id=${{ steps.sim.outputs.udid }}" \
              -only-testing:OpenHikesTests/GPXImportTests \
              -only-testing:OpenHikesTests/GPXImportDateTests \
              -only-testing:OpenHikesTests/SerialAsyncQueueTests \
              -only-testing:OpenHikesTests/TrackJournalTests \
              -only-testing:OpenHikesTests/HikeRecorderTests \
              -only-testing:OpenHikesTests/RecordingPreparationTests \
              -only-testing:OpenHikesTests/RecordingFixPolicyTests \
              -only-testing:OpenHikesTests/RecordingTraceTests \
              -only-testing:OpenHikesTests/RecordingEnergyPolicyTests \
              -only-testing:OpenHikesTests/PowerStateMonitorTests \
              -only-testing:OpenHikesTests/TrailMatcherTests \
              -only-testing:OpenHikesTests/OverpassTrailGraphProviderTests \
              -only-testing:OpenHikesTests/OverpassTrailGraphCancellationTests \
              -only-testing:OpenHikesTests/TileCacheTierTests \
              -only-testing:OpenHikesTests/TileStoreTests \
              -only-testing:OpenHikesTests/TileLoadGateTests \
              -only-testing:OpenHikesTests/TileOverzoomTests \
              -only-testing:OpenHikesTests/TileRetryTests \
              -only-testing:OpenHikesTests/TileTransportTests \
              -only-testing:OpenHikesTests/AutoSaveDrainTests \
              -only-testing:OpenHikesTests/AutoSaveLifecycleTests \
              -only-testing:OpenHikesTests/TileOwnershipTests \
              -only-testing:OpenHikesTests/TileDurableQuotaTests \
              -only-testing:OpenHikesTests/StorageAccountingTests \
              -only-testing:OpenHikesTests/OfflineTileEnumerationTests \
              -only-testing:OpenHikesTests/OfflineDownloadStateTests \
              -only-testing:OpenHikesTests/CloudSyncCoordinatorTests \
              -only-testing:OpenHikesTests/LocationPublishingTests \
              -only-testing:OpenHikesTests/LocationFixStreamTests \
              -only-testing:OpenHikesTests/BackgroundTrackingAuthorizationTests \
              -only-testing:OpenHikesTests/WidgetFeedSuites \
              -enableThreadSanitizer YES \
              -parallel-testing-enabled NO \
              -resultBundlePath TestResults/ThreadSanitizer.xcresult \
              -skipPackagePluginValidation 2>&1 | tee "$1"
            return "${PIPESTATUS[0]}"
          }

          for attempt in 1 2; do
            log="TestResults/tsan-attempt-${attempt}.log"
            if run_tsan "$log"; then
              exit 0
            fi

            if grep -q 'ThreadSanitizer: data race' "$log"; then
              echo "::error::ThreadSanitizer reported a data race — see the raw log above."
              exit 1
            fi

            if ! grep -qE 'never finished bootstrapping|while preparing to run tests' "$log"; then
              echo "::error::The TSan run failed with tests having started; this is a result, not the machine."
              exit 1
            fi

            echo "::warning::Attempt ${attempt} died before running a test (no race, no test result)."
          done

          echo "::error::The app never finished bootstrapping under TSan in 2 attempts."
          exit 1

      - name: Delete the private simulator
        if: always() && steps.sim.outputs.udid != ''
        run: xcrun simctl delete "${{ steps.sim.outputs.udid }}" || true

      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: thread-sanitizer-xcresult
          path: TestResults/ThreadSanitizer.xcresult
          retention-days: 7

  accessibility-ui-tests:
    name: Accessibility UI tests
    runs-on: macos-26
    timeout-minutes: 30
    # Reporting, not gating. UI automation on a shared runner has to earn a
    # place in the merge path, so this runs for a while and its flake rate is
    # observed before a red run is allowed to block anything.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/verify-xcode

      # Same reason as the unit-test job: a cold simulator is what turns the
      # first launch into "never finished bootstrapping".
      - name: Boot the simulator
        run: |
          xcrun simctl boot "$IOS_SIMULATOR" || true
          xcrun simctl bootstatus "$IOS_SIMULATOR" -b

      # testRecordingScreenIsReadable is the one test here that needs a fix
      # delivered. The grant is keyed by bundle id, so it can be made before
      # the test installs the app and no permission alert ever appears; the
      # test keeps its interruption monitor for a simulator where it does not
      # take.
      - name: Grant location up front
        run: |
          xcrun simctl privacy booted grant location-always tappium.com.OpenHikes \
            || true

      # The same script a developer runs locally, for the same reason as
      # Scripts/lint.sh above. --suite scopes each run to one accessibility
      # class, so neither PerformanceUITests nor the launch-metric test in
      # OpenHikesUITests can execute here: a measurement taken on a shared
      # runner is noise, and both assert nothing.
      #
      # Two classes, run separately so a failure names which half broke: the
      # audits are a sweep of each screen, the label tests are assertions on
      # what individual controls promise.
      - name: Run the accessibility audits
        run: |
          mkdir -p TestResults
          Scripts/run-ui-tests.sh \
            --suite AccessibilityUITests \
            --all \
            --retry \
            --result-bundle TestResults/AccessibilityUITests.xcresult

      - name: Run the accessibility label assertions
        run: |
          Scripts/run-ui-tests.sh \
            --suite AccessibilityLabelUITests \
            --all \
            --retry \
            --result-bundle TestResults/AccessibilityLabelUITests.xcresult

      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: accessibility-uitests-xcresult
          path: |
            TestResults/AccessibilityUITests.xcresult
            TestResults/AccessibilityLabelUITests.xcresult
          retention-days: 7

# The functional UI automation and the performance suite are deliberately not
# run here. Both drive a simulator through real gestures and timing-sensitive
# waits, which a shared runner makes slow and unreliable, and
# `PerformanceUITests` additionally produces measurements that are only
# comparable against the same hardware.
#
# `AccessibilityUITests` and `AccessibilityLabelUITests` are the exception
# above: together they are the only automated guard on the VoiceOver contract,
# a regression in which is invisible to a unit test and to a reviewer. They are
# also the cheapest part of the bundle to run — all but two of their tests are
# launch, tap and assert against an in-memory store and a bundled GPX, with no
# location and no measurement.
#
#   Scripts/run-ui-tests.sh --all
#   Scripts/run-performance-tests.sh
