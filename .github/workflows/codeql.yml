name: CodeQL

# Swift is the only language in this repository that CodeQL can analyse, and
# CodeQL's Swift support runs on macOS only — it traces an Xcode build, so
# there is no Linux path and no `build-mode: none` for it. That makes this the
# second macOS job in the repository, and the reason it is not folded into
# ci.yml: it costs a full extra build of the app and does not gate a merge.
on:
  pull_request:
    paths:
      - "**/*.swift"
      - "OpenHikes.xcodeproj/**"
      - "OpenHikesShared/Package*"
      - ".github/workflows/codeql.yml"
  push:
    branches:
      - main
  schedule:
    # Weekly, so a newly published query finds this code without waiting for
    # somebody to open a pull request.
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Deliberately still Xcode 26.6 on `macos-26`, where `ci.yml` has moved to
# Xcode 27.0 on the `xcode-27` image. This is not drift: CodeQL's Swift
# extractor analyses up to Swift 6.3.3 (`codeql/swift-all` 6.8.0, in bundle
# 2.27.0, which is what the pinned action downloads) and Xcode 27 ships Swift
# 6.4, so an extractor on the newer image has nothing to extract with. Xcode
# 26.6 is the newest Swift the analysis can actually read, which makes it the
# right pin for *this* job and the wrong one for every job in `ci.yml`.
#
# Move this to `xcode-27` and drop these lines once a bundle announces Swift
# 6.4 in `swift/ql/lib/CHANGELOG.md`; until then the two workflows disagree on
# purpose, and only this file's build compiles the app on 26.6.
env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-26
    # Not a guess: this job has measured 47, 52, 53, 54, 55, 57 and 58 minutes
    # across recent runs, so a 60-minute ceiling left it 2 minutes of margin on
    # a bad day and it was duly killed mid-analysis on #214 — a red run that
    # said nothing about the code that triggered it. Raised well clear of the
    # spread rather than to just above the worst case, since the number this is
    # protecting against is a runner having a slow hour, not the analysis
    # growing.
    #
    # The two halves are nothing like equal, and the split is where to look
    # first when this drifts. Measured on the green run 35511502709
    # (2026-09-20): 52s to initialise, **51m44s** in `Build for analysis`, and
    # 3m17s for the whole of `analyze` — finalize 1m37s, queries 1m04s,
    # interpretation and upload the rest. So this is a build job with a query
    # step stapled to it, and every lever that has ever moved the number is a
    # flag on that one `xcodebuild` call below.
    timeout-minutes: 120
    # Reporting, not gating — the same stance the accessibility job in ci.yml
    # takes, for the same reason. CodeQL's Swift extractor tracks specific
    # Swift versions (2.26.2 added 6.3.3, which is what Xcode 26.6 ships), so a
    # runner-image Xcode bump can outrun the bundle and produce a red run that
    # says nothing about this code — which is exactly why the pin above did not
    # follow ci.yml onto Xcode 27. Keep this line while that gap is open: it is
    # what makes the pin a considered lag rather than a bet.
    continue-on-error: true
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/verify-xcode

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: swift
          # Manual rather than autobuild: autobuild guesses at the largest
          # Xcode target, and this project already has one known-good build
          # command. It also has to carry -skipPackagePluginValidation, which
          # autobuild would not add — see the same flag on every xcodebuild
          # call in ci.yml.
          build-mode: manual
          queries: security-and-quality

      # No signing identity exists on a runner, and CodeQL only needs the
      # compilation to happen — not a runnable product — so signing is turned
      # off outright rather than worked around. A simulator destination for the
      # same reason: it needs no device SDK and no provisioning profile.
      #
      # Everything after that is about one thing: keeping this build inside a
      # 3-core, 7 GB `macos-26-arm64` runner that the action sizes itself to
      # with `CODEQL_RAM: 6144`, `CODEQL_THREADS: 3`. Eight jobs
      # between 2026-09-20 and 2026-09-21 ended with "The hosted runner lost
      # communication with the server", each after 80 to 117 minutes against a
      # 41-to-62-minute green run. A runner that dies that way uploads no logs
      # at all, so the annotation and the duration are the entire diagnostic.
      # The 120-minute timeout was never reached and was never the problem.
      #
      # `ARCHS=arm64` cut the *volume* of work in half. A generic simulator
      # destination has no active architecture to narrow to, so Xcode falls
      # back to the target's full `ARCHS` and `ONLY_ACTIVE_ARCH` reports `NO`
      # whatever the configuration says — `xcodebuild -showBuildSettings` for
      # the destination above prints `ARCHS = arm64 x86_64`. That compiled
      # every Swift file in the app, the widget, the watch app and the shared
      # package twice, and because the extractor is traced onto the compiler it
      # extracted each file twice too, into one database that is the same size
      # and yields the same alerts. `ONLY_ACTIVE_ARCH=NO` is stated rather than
      # left implied, so the pair reads the same way it would on a named
      # destination. The x86_64 simulator slice is not lost coverage: the
      # `builds` matrix in `ci.yml` still compiles it, on a job with no
      # extractor attached and no history of this failure.
      #
      # It was not enough on its own. Run 35566694058 carried that flag and
      # died the same way, 91 minutes into this step — so what kills the runner
      # is not how much work there is but how much of it is alive at once, and
      # halving the total left the peak untouched. The same peak is visible in
      # the last green run, 35511502709: inside its 51m44s build are single
      # stalls of 582s, 468s and 185s between consecutive compile lines, which
      # is a 7 GB machine swapping, not a 3-core machine computing.
      #
      # `-jobs 2` is the lever for that peak. Three concurrent `swiftc`
      # processes, each with an extractor writing TRAP files beside it, is the
      # whole of this box before the operating system takes its share; two
      # leaves headroom, and wall clock is the thing this job has to spare.
      # `COMPILER_INDEX_STORE_ENABLE=NO` drops index-while-building, which
      # costs memory and a pass over every file to produce an index store that
      # nothing here reads — the extractor builds its own database.
      #
      # If a run dies here again, the next lever is the runner, not the
      # timeout, which never had anything to do with it: this job is alone on
      # `macos-26` and a 6-core, 14 GB `macos-26-xlarge` would end the question
      # — at a price, where everything above is free. Measure before paying:
      # the build step's duration in a green run is the number that says
      # whether the headroom arrived.
      #
      # Not piped through xcbeautify: this build is an input to the extractor
      # rather than a report for a human, and when extraction goes wrong the
      # raw compiler invocations are what says why.
      - name: Build for analysis
        run: |
          set -o pipefail
          xcodebuild build \
            -project OpenHikes.xcodeproj \
            -scheme OpenHikes \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            -jobs 2 \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:swift"
