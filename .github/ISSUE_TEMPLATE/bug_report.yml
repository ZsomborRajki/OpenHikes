name: Bug report
description: Something in the app behaves differently from how it is documented.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Please do not report a security problem here — see
        [SECURITY.md](https://github.com/ZsomborRajki/OpenHikes/blob/main/docs/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: >-
        Numbered steps, starting from a fresh launch. If a specific GPX file or
        a specific place on the map is needed, say so.
      placeholder: |
        1. Launch the app
        2. …
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and iOS version
      placeholder: iPhone 17 Pro, iOS 26.5 — or "iPhone 17 Pro Simulator"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app
      options:
        - GPX import or export
        - Live recording
        - Trail matching or route review
        - Map, tiles or offline downloads
        - Photos
        - Weather
        - iCloud sync
        - Home Screen widget
        - Settings
        - Something else
    validations:
      required: true

  - type: input
    id: tile-provider
    attributes:
      label: Tile provider
      description: Only if the problem involves the map.
      placeholder: OpenStreetMap / Apple Maps / Stadia Outdoors / Thunderforest Outdoors

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: >-
        Screenshots, a screen recording, or console output. Please redact
        location data you would rather not publish — a GPX track is a map of
        where you have been.
