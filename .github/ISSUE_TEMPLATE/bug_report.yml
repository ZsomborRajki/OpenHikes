name: Bug report
description: Something in the app does not work as it should.
labels:
  - bug
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: >-
        What you saw, what you expected, and the steps that make it happen.
        Screenshots help; leave out locations you would rather not publish.
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: iPhone 18 Pro, iOS 27.2
